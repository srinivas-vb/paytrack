# Render Blueprint for PayTrack.
#
# Deploy: Render dashboard -> New -> Blueprint -> select this repo.
# (Requires GitHub to be authorized for the repo first, since it is private.)
#
# Everything here is on FREE plans. The cron job and background worker are
# commented out because both require a paid plan -- see the notes below each.
#
# Build commands are repo-root-relative rather than using rootDir, so they
# behave identically whether created by this blueprint or via the Render API
# (which has no rootDir field). One build approach, no drift.

databases:
  - name: paytrack-db
    databaseName: paytrack
    plan: free # NOTE: free Postgres expires 30 days after creation

services:
  # --- API -----------------------------------------------------------------
  - type: web
    name: paytrack-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/src/index.js
    healthCheckPath: /health # liveness only -- see server/src/index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paytrack-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false # set in the dashboard; never in git
      - key: ALLOWED_ORIGINS
        sync: false # set to the paytrack-web URL once it exists

  # --- Frontend ------------------------------------------------------------
  - type: web
    name: paytrack-web
    runtime: static
    buildCommand: npm install && npm run build --workspace=web
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to the paytrack-api URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Nightly notarization (PAID -- disabled) -----------------------------
  # Render Cron Jobs require a paid plan. Until then the API falls back to
  # notarize-on-write (server/src/notarize.js), which is throttled to at most
  # one notarization per worker per hour.
  #
  # Honest difference for the pitch: cron proves the chain's state at a fixed
  # time regardless of whether the worker did anything. Notarize-on-write only
  # records state when the worker acts. The timestamp is still server-issued
  # and still unforgeable by the worker -- it is just activity-driven rather
  # than schedule-driven.
  #
  # Enable by uncommenting and setting a paid plan:
  #
  # - type: cron
  #   name: paytrack-notarize
  #   runtime: node
  #   plan: starter
  #   schedule: '0 8 * * *'          # 08:00 UTC daily
  #   buildCommand: npm install
  #   startCommand: node server/src/jobs/notarize.js
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: paytrack-db
  #         property: connectionString

  # --- Backfill queue (PAID -- disabled, Phase 4) --------------------------
  # A worker runs continuously, so enabling it burns a paid service idling.
  # Uncomment when the backfill queue actually exists.
  #
  # - type: worker
  #   name: paytrack-worker
  #   runtime: node
  #   plan: starter
  #   buildCommand: npm install
  #   startCommand: node server/src/jobs/backfill-worker.js
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: paytrack-db
  #         property: connectionString
  #     - key: ANTHROPIC_API_KEY
  #       sync: false
