# Render Blueprint for PayTrack.
#
# Deploy: push to GitHub, then Render dashboard -> New -> Blueprint -> pick repo.
#
# Four services, each with a reason it cannot be swapped out -- that is the
# Best Use of Render pitch:
#   web service  the ONLY trusted holder of ANTHROPIC_API_KEY
#   postgres     evidence ledger that refuses its own UPDATEs
#   cron         independent timestamp the worker's device cannot forge
#   worker       async batch backfill (12 paystubs = 12 vision calls)

databases:
  - name: paytrack-db
    databaseName: paytrack
    plan: free

services:
  # --- API -----------------------------------------------------------------
  - type: web
    name: paytrack-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paytrack-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in the dashboard; never in git
      - key: ALLOWED_ORIGINS
        sync: false          # set to the static site URL once it exists

  # --- Frontend ------------------------------------------------------------
  - type: web
    name: paytrack-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false          # set to the paytrack-api URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Nightly notarization (Phase 4) --------------------------------------
  # NOTE: Cron Jobs have historically been a PAID Render feature. Deploy this
  # blueprint on day one to find out whether your plan includes it -- the whole
  # notarization layer depends on the answer, and discovering it on day two is
  # expensive. Fallback if unavailable: notarize-on-write in the API.
  - type: cron
    name: paytrack-notarize
    runtime: node
    plan: starter
    rootDir: server
    schedule: '0 8 * * *'    # 08:00 UTC daily
    buildCommand: npm install
    startCommand: node src/jobs/notarize.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paytrack-db
          property: connectionString

  # --- Backfill queue (Phase 4) --------------------------------------------
  # Commented out until Phase 4. A worker runs continuously, so enabling it now
  # would burn a paid service idling all weekend. Uncomment when the backfill
  # queue actually exists.
  #
  # - type: worker
  #   name: paytrack-worker
  #   runtime: node
  #   plan: starter
  #   rootDir: server
  #   buildCommand: npm install
  #   startCommand: node src/jobs/backfill-worker.js
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: paytrack-db
  #         property: connectionString
  #     - key: ANTHROPIC_API_KEY
  #       sync: false
